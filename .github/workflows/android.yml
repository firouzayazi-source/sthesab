# ساخت APK اندروید — پوسته‌ی TWA روی همان PWA.
#
# ⚠ این فایل باید در **ریشه‌ی مخزن** باشد، نه در `mobile/`.
# گیت‌هاب فقط `.github/workflows/` ریشه را می‌خواند؛ یک پله پایین‌تر
# بی‌هیچ خطایی نادیده گرفته می‌شود و زبانه‌ی Actions خالی می‌ماند.
#
# اپ هیچ کد برنامه‌ای ندارد: خودِ سایت اجرا می‌شود و کروم رندرش می‌کند.
# پس این ساخت فقط یک پوسته‌ی چندصد کیلوبایتی می‌سازد و هر تغییرِ سایت
# بدون APK تازه به کاربر می‌رسد.

name: ساخت APK اندروید

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - '.well-known/assetlinks.json'
      - '.github/workflows/android.yml'
      - 'includes/apk_meta.php'
      - 'deploy/apk-version.php'

jobs:
  build:
    runs-on: ubuntu-latest

    # فقط برای ساختن Release. جز همین، دسترسی نوشتنی‌ای داده نمی‌شود.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # ⛔ پیش از هر کار سنگینی سنجیده می‌شود.
      #
      # بدون کلید، گریدل یک APK **امضانشده** می‌سازد که نه نصب می‌شود و
      # نه اثر انگشتش با assetlinks می‌خواند — و این را کاربر تازه روی
      # گوشی می‌فهمید. شکستِ صریح در ثانیه‌ی اول بهتر از فایلِ خراب در
      # دقیقه‌ی دهم است.
      - name: بررسی وجود کلید امضا
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          PW: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$PW" ]; then
            echo "::error::دو Secret لازم است و تنظیم نشده‌اند: KEYSTORE_BASE64 و KEYSTORE_PASSWORD."
            echo "::error::در مخزن → Settings → Secrets and variables → Actions اضافه‌شان کنید."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ⛔ `android-actions/setup-android` برداشته شد، نه پین.
      #
      # آن اکشن بی‌قید `sdkmanager tools` را نصب می‌کند و گوگل بسته‌ی
      # `tools` را از مخزن برداشته است: «Warning: Failed to find package
      # 'tools'» و خروجِ ۱. یعنی ساخت برای چیزی قرمز می‌شد که **هیچ ربطی
      # به کدِ ما ندارد** و با هیچ تغییری در این مخزن درست نمی‌شد.
      #
      # ایمیجِ ubuntu-latest خودش Android SDK را دارد، پس تنها کارِ لازم
      # نصبِ **دقیقاً** همان چیزی است که پروژه می‌خواهد. با فهرستِ صریح،
      # نسخه‌ی SDK هم دیگر به محتوای ایمیجِ آن روز بند نیست.
      - name: آماده‌سازی Android SDK
        run: |
          set -eu
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK" || { echo "::error::Android SDK روی ایمیج پیدا نشد: $SDK"; exit 1; }

          # ⚠ مسیرِ cmdline-tools نسخه‌دار است (`16.0/`, `latest/`, …) و
          #    با ایمیج عوض می‌شود، پس سخت‌کد نمی‌شود.
          SDKMGR=$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -1)
          test -n "$SDKMGR" || { echo "::error::sdkmanager پیدا نشد."; exit 1; }

          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

          # ⛔ «دستور خطا نداد» با «ابزار سرِ جایش است» یکی نیست.
          #    بدونِ این سنجش، نبودِ build-tools تازه در گامِ بازرسیِ
          #    manifest معلوم می‌شد — یعنی بعد از چند دقیقه ساخت.
          test -d "$SDK/platforms/android-35" \
            || { echo "::error::platforms;android-35 نصب نشد."; exit 1; }
          find "$SDK/build-tools" -name aapt2 -type f | grep -q . \
            || { echo "::error::aapt2 در build-tools پیدا نشد."; exit 1; }

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "✓ Android SDK آماده است: $SDK"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # ⛔ کلید همین‌جا کامل سنجیده می‌شود، پیش از ساختِ چنددقیقه‌ای.
      #
      # یک بار ساخت تا آخرین گام رفت و آنجا با «keystore password was
      # incorrect» ایستاد. آن پیام گمراه‌کننده است: **کلیدِ خراب هم همین
      # را می‌دهد**، چون بررسی سلامتِ فایل با همان رمز انجام می‌شود. پس
      # از روی آن نمی‌شد فهمید مشکل از رمز است یا از base64 ناقص.
      #
      # اینجا آن دو از هم جدا می‌شوند و هر کدام پیام خودش را می‌گیرد.
      - name: بازکردن و سنجش کلید امضا
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          PW: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          KEYSTORE="$RUNNER_TEMP/hesabland-release.jks"

          # ⚠ کلید بیرون از پوشه‌ی کار ساخته می‌شود تا حتی اگر روزی
          # گامی کل پوشه را artifact کند، کلید همراهش نرود.
          #
          # فاصله و شکستِ خط از base64 حذف می‌شود: کپی کردنِ ۵۸۰۰ کاراکتر
          # از یک فایل روی گوشی معمولاً چند جای خط را می‌شکند و آن‌وقت
          # `base64 -d` یا خطا می‌دهد یا فایلِ ناقص می‌سازد.
          printf '%s' "$KS" | tr -d '[:space:]' | base64 -d > "$KEYSTORE" 2>/dev/null || true

          if [ ! -s "$KEYSTORE" ]; then
            echo "::error::KEYSTORE_BASE64 اصلاً باز نشد. محتوای فایل را کامل کپی کنید."
            exit 1
          fi

          # رمز ممکن است هنگام کپی، فاصله یا خطِ اضافه گرفته باشد. نسخه‌ی
          # پاک‌شده هم امتحان می‌شود، ولی اگر همان جواب داد صریحاً گفته
          # می‌شود تا Secret اصلاح شود — نه اینکه بی‌سروصدا درست کار کند
          # و دفعه‌ی بعد جای دیگری بشکند.
          PW_TRIM=$(printf '%s' "$PW" | tr -d '[:space:]')
          echo "::add-mask::$PW_TRIM"

          # ⛔ `-alias daftar` عمداً با برند عوض **نشد** و نباید بشود.
          #    این نامِ ما نیست، نامِ ورودیِ داخلِ همان فایلِ keystore است
          #    که در `KEYSTORE_BASE64` نشسته. عوض کردنش یعنی `keytool`
          #    ورودی را پیدا نمی‌کند و همین‌جا با «keystore password was
          #    incorrect» می‌ایستد — پیامی که هیچ ربطی به علتش ندارد و
          #    ساعت‌ها دنبالِ رمز می‌گردید. (در `build.gradle.kts` هم
          #    همین رشته است و هر دو باید یکی بمانند.)
          USED=""
          if keytool -list -keystore "$KEYSTORE" -storepass "$PW" -alias daftar >/dev/null 2>&1; then
            USED="$PW"
          elif keytool -list -keystore "$KEYSTORE" -storepass "$PW_TRIM" -alias daftar >/dev/null 2>&1; then
            USED="$PW_TRIM"
            echo "::warning::KEYSTORE_PASSWORD فاصله یا خطِ اضافه داشت. کار کرد، ولی بهتر است Secret را دوباره و بدون فاصله ثبت کنید."
          fi

          if [ -z "$USED" ]; then
            # ⚠ تشخیص روی پیامِ **رمز** انجام می‌شود، نه روی پیام‌های
            #    خرابی. علتش این است که خرابیِ فایل چند شکل دارد و هر
            #    کدام پیام خودش را می‌دهد (EOFException برای فایلِ نصفه،
            #    «Unrecognized keystore format» برای فایلِ بی‌ربط، …) ولی
            #    رمزِ غلط فقط یک پیام دارد. نسخه‌ی اول برعکس بود و
            #    فایلِ نصفه را «رمز نادرست» گزارش می‌کرد — یعنی همان
            #    ابهامی که این گام برای رفعش نوشته شده بود.
            ERR=$(keytool -list -keystore "$KEYSTORE" -storepass "$PW" 2>&1 || true)
            if echo "$ERR" | grep -qi 'password was incorrect'; then
              echo "::error::KEYSTORE_PASSWORD نادرست است."
              echo "::error::همان رشته‌ی ۲۴ کاراکتری باشد، بدون فاصله‌ی ابتدا یا انتها."
            else
              echo "::error::فایل کلید سالم نیست — KEYSTORE_BASE64 ناقص یا خراب کپی شده."
              echo "::error::باید یک خطِ پیوسته و کامل باشد (حدود ۵۸۰۰ کاراکتر)."
              echo "::error::پیام ابزار: $(echo "$ERR" | head -1)"
            fi
            exit 1
          fi

          # اثر انگشت هم همین‌جا سنجیده می‌شود، نه بعد از ساخت: اگر کلید
          # با assetlinks نخواند، ساختنِ APK اتلاف وقت است.
          BUILT=$(keytool -list -v -keystore "$KEYSTORE" -storepass "$USED" -alias daftar \
                  | grep -m1 'SHA256:' | sed 's/.*SHA256: *//' | tr -d ' ')
          WANTED=$(python3 -c "import json;print(json.load(open('.well-known/assetlinks.json'))[0]['target']['sha256_cert_fingerprints'][0])")

          if [ "$BUILT" != "$WANTED" ]; then
            echo "::error::اثر انگشتِ کلید با assetlinks.json نمی‌خواند."
            echo "::error::کلید: $BUILT"
            echo "::error::انتظار: $WANTED"
            echo "::error::یا کلیدِ داخل Secrets عوض شده، یا assetlinks.json به‌روز نیست."
            exit 1
          fi
          echo "✓ کلید سالم است و اثر انگشتش با assetlinks می‌خواند."

          echo "KEYSTORE_PASSWORD=$USED" >> "$GITHUB_ENV"

      - name: ساخت APK امضاشده
        working-directory: mobile
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/hesabland-release.jks
        run: gradle assembleRelease --no-daemon

      # ⛔ سنجشِ نتیجه، نه فقط «ساخت موفق بود».
      #
      # اثر انگشتِ APK ساخته‌شده باید دقیقاً همانی باشد که در
      # `.well-known/assetlinks.json` نوشته‌ایم. اگر نخواند، اپ نصب
      # می‌شود ولی با نوار آدرس بالا می‌آید — یعنی خرابیِ بی‌صدا، چون
      # ساخت سبز بوده. این گام همان را جلو می‌گیرد.
      - name: سنجش اثر انگشت در برابر assetlinks
        working-directory: mobile
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$APK" || { echo "::error::APK ساخته نشد."; exit 1; }

          BUILT=$(keytool -printcert -jarfile "$APK" \
                  | grep -m1 'SHA256:' | sed 's/.*SHA256: *//' | tr -d ' ')
          WANTED=$(python3 -c "import json;print(json.load(open('../.well-known/assetlinks.json'))[0]['target']['sha256_cert_fingerprints'][0])")

          echo "ساخته‌شده: $BUILT"
          echo "assetlinks: $WANTED"
          if [ "$BUILT" != "$WANTED" ]; then
            echo "::error::اثر انگشت APK با assetlinks.json نمی‌خواند."
            echo "::error::اپ نصب می‌شود ولی نوار آدرس بالای صفحه می‌ماند."
            echo "::error::یا کلیدِ داخل Secrets عوض شده، یا assetlinks.json به‌روز نیست."
            exit 1
          fi
          echo "✓ اثر انگشت می‌خواند."

          # ⛔ «ساخت موفق شد» با «درست کار می‌کند» یکی نیست — همان درسی که
          #    قاعده‌ی nginx در api/v1 داد، این بار روی APK.
          #
          #    اگر گیرنده‌ی پیامک یا مجوزش از manifestِ **نهایی** بیفتد،
          #    گریدل هیچ خطایی نمی‌دهد: APK ساخته می‌شود، نصب می‌شود، و
          #    فقط هیچ پیامکی گرفته نمی‌شود. کاربر تازه بعد از اولین
          #    برداشتِ بانکی می‌فهمد. پس خودِ APK بازرسی می‌شود، نه فایلِ
          #    منبع (که تستِ قرارداد از قبل می‌سنجدش).
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -1)
          if [ -n "$AAPT" ]; then
            DUMP=$("$AAPT" dump xmltree --file AndroidManifest.xml "$APK" 2>/dev/null || true)
            # ⛔ `POST_NOTIFICATIONS` هم در همین فهرست است و اختیاری نیست:
            #    روی اندروید ۱۳ به بالا بدونش پیامک خوانده می‌شود و هیچ
            #    اعلانی دیده نمی‌شود — یعنی همان خرابیِ بی‌صدا، این بار یک
            #    قدم جلوتر.
            for NEEDLE in "RECEIVE_SMS" "READ_SMS" "POST_NOTIFICATIONS" "BankSmsReceiver" "SmsSetupActivity" "HesabLauncherActivity"; do
              if ! printf '%s' "$DUMP" | grep -q "$NEEDLE"; then
                echo "::error::«$NEEDLE» در manifestِ خودِ APK نیست."
                echo "::error::اپ ساخته و نصب می‌شود ولی ثبت خودکار از پیامک کار نمی‌کند."
                exit 1
              fi
            done
            echo "✓ گیرنده‌ی پیامک و مجوزش در APK هستند."

            # ⛔ versionCode از خودِ APK خوانده می‌شود، نه از build.gradle.kts.
            #    فروشگاه (مایکت/کافه‌بازار) این عدد را می‌بیند، نه فایلِ
            #    منبع — و گامِ بعدی با همین عدد قضاوت می‌کند.
            VC=$("$AAPT" dump badging "$APK" 2>/dev/null \
                 | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
            test -n "$VC" || { echo "::error::versionCode از APK خوانده نشد."; exit 1; }
            echo "VERSION_CODE=$VC" >> "$GITHUB_ENV"
            echo "✓ versionCode = $VC"

            # ⛔ نوارِ «نسخه‌ی تازه‌ی اپ آماده است» روی سایت، نسخه را با
            #    تجزیه‌گرِ PHPِ خودمان (`includes/apk_meta.php`) از همین فایل
            #    می‌خواند. اینجا روی APKِ **واقعیِ** همین ساخت با aapt2
            #    مقایسه می‌شود — اگر روزی قالبِ خروجیِ aapt2 عوض شود، ساخت
            #    قرمز می‌شود، نه اینکه نوار بی‌صدا نیاید یا دروغ بگوید.
            PKG=$("$AAPT" dump badging "$APK" 2>/dev/null \
                  | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)
            SITE=$(php ../deploy/apk-version.php --expect "$APK") \
              || { echo "::error::خواننده‌ی نسخه‌ی سایت این APK را نخواند (یا نامِ بسته فرق دارد)."; exit 1; }
            SC=$(printf '%s' "$SITE" | cut -f1)
            SP=$(printf '%s' "$SITE" | cut -f3)
            echo "سایت: $SITE — aapt2: $VC $PKG"
            if [ "$SC" != "$VC" ] || [ "$SP" != "$PKG" ]; then
              echo "::error::نسخه‌ای که سایت از APK می‌خواند ($SC $SP) با aapt2 ($VC $PKG) یکی نیست."
              echo "::error::نوارِ به‌روزرسانی روی گوشی کاربر دروغ می‌گفت."
              exit 1
            fi
            echo "✓ خواننده‌ی نسخه‌ی سایت با aapt2 می‌خواند."
          else
            echo "::warning::aapt2 پیدا نشد؛ بازرسیِ manifestِ APK انجام نشد."
          fi

          cp "$APK" "$GITHUB_WORKSPACE/hesabland-${{ github.run_number }}.apk"
          ls -lh "$GITHUB_WORKSPACE/hesabland-${{ github.run_number }}.apk"

      # ⛔ «ساخت موفق شد» با «فروشگاه قبولش می‌کند» یکی نیست.
      #
      # مایکت (و هر فروشگاه دیگری) نسخه‌ای را که `versionCode` اش قبلاً
      # بارگذاری شده **رد می‌کند**. خرابی‌اش بی‌صداست و دقیقاً در بدترین
      # جا دیده می‌شود: APK سالم است، ساخت سبز است، و تازه پشتِ فرمِ
      # بارگذاری معلوم می‌شود که باید از اول ساخت. و چون `versionCode`
      # دستی در `build.gradle.kts` نوشته می‌شود، فراموش کردنش کارِ
      # همیشگی است.
      #
      # ⚠ مرجعِ مقایسه، یادداشتِ همین Release هاست — نه یک فایلِ دوم در
      #   مخزن که با فراموشیِ دیگری کهنه می‌شود. اگر Release ای بدونِ
      #   این خط باشد (نسخه‌های پیش از این گام)، صفر شمرده می‌شود و
      #   بررسی آبرومندانه از رویش رد می‌شود، نه اینکه بشکند.
      - name: سنجش versionCode در برابر نسخه‌های منتشرشده
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test -n "${VERSION_CODE:-}" || { echo "::error::versionCode خوانده نشده."; exit 1; }

          MAX=0
          for TAG in $(gh release list --limit 100 --json tagName -q '.[].tagName'); do
            N=$(gh release view "$TAG" --json body -q .body 2>/dev/null \
                | sed -n 's/^ *versionCode: *\([0-9]*\).*/\1/p' | head -1)
            [ -n "$N" ] && [ "$N" -gt "$MAX" ] && MAX="$N" || true
          done

          echo "بالاترین versionCode منتشرشده: $MAX — این ساخت: $VERSION_CODE"
          if [ "$MAX" -gt 0 ] && [ "$VERSION_CODE" -le "$MAX" ]; then
            echo "::error::versionCode ($VERSION_CODE) از نسخه‌ی منتشرشده ($MAX) بالاتر نیست."
            echo "::error::مایکت این APK را رد می‌کند. در mobile/app/build.gradle.kts"
            echo "::error::مقدار versionCode را به $((MAX + 1)) (یا بالاتر) ببرید و versionName را هم به‌روز کنید."
            exit 1
          fi
          echo "✓ versionCode قابل بارگذاری است."

      - uses: actions/upload-artifact@v4
        with:
          name: hesabland-apk-${{ github.run_number }}
          path: hesabland-*.apk
          retention-days: 30

      # artifact همیشه zip دانلود می‌شود، حتی با یک فایل. روی گوشی یعنی
      # کاربر باید zip را باز کند — کاری که اندروید بدون فایل‌منیجر
      # نمی‌کند. Release فایل را خام می‌دهد و اندروید همان‌جا نصب را
      # پیشنهاد می‌کند.
      - name: انتشار برای دانلود مستقیم
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            "hesabland-${{ github.run_number }}.apk" \
            --title "نسخه ${{ github.run_number }}" \
            --notes "ساخته‌شده از ${{ github.sha }}

          versionCode: ${VERSION_CODE}

          پوسته‌ی TWA روی hesab.stland.ir — همان سایت، تمام‌صفحه.

          برای نصب: فایل APK زیر را روی گوشی اندروید باز کنید.
          اگر اندروید اجازه نداد، در همان پیام «تنظیمات» را بزنید و
