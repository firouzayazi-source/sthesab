org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# بیشترین compileSdk ای که AGP 9.1.0 «توصیه‌شده» می‌داند ۳۶ است، ولی ما
# روی ۳۷ هستیم (دلیلش در app/build.gradle.kts نوشته شده). بدون این خط،
# هر ساخت یک هشدار چندخطی می‌دهد که کاری هم برایش نمی‌شود کرد — و هشدارِ
# همیشگی بدتر از نبودنش است، چون آدم را عادت می‌دهد هشدارها را نادیده
# بگیرد و آن‌وقت هشدارِ واقعی هم دیده نمی‌شود.
#
# این فقط هشدار را خاموش می‌کند، نه یک بررسیِ واقعی را: خطای اصلی
# (checkReleaseAarMetadata) با خودِ compileSdk حل می‌شود، نه با این.
android.suppressUnsupportedCompileSdk=37
